<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>頁面不存在｜薩泰爾線上周邊商店</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --ink: #fff;
      --mute: #9a9a9a;
      --line: #2a2a2a;
      --yellow: #f5d000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 28px 32px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      color: var(--ink);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: .08em;
      text-decoration: none;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      border: 2px solid var(--ink);
      padding: 44px 40px 40px;
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid var(--line);
      pointer-events: none;
    }

    .tag {
      display: inline-block;
      margin-bottom: 22px;
      padding: 4px 10px;
      background: var(--yellow);
      color: #000;
      font-size: 13px;
      font-weight: 900;
    }

    h1 {
      margin-bottom: 22px;
      font-size: clamp(30px, 6vw, 44px);
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -.01em;
    }

    .lead {
      max-width: 36ch;
      margin-bottom: 34px;
      color: var(--mute);
      font-size: 16px;
      line-height: 1.8;
    }

    .actions { display: flex; flex-direction: column; gap: 12px; }

    .btn {
      height: 56px;
      border: 2px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      transition: background .15s, color .15s;
    }

    .btn.primary { background: var(--ink); color: #000; }
    .btn.primary:hover { background: var(--yellow); border-color: var(--yellow); }
    .btn.ghost:hover { background: #111; }
    .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

    footer {
      padding: 20px 32px;
      border-top: 1px solid var(--line);
      color: var(--mute);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    footer a { color: var(--mute); text-decoration: none; }
    footer a:hover { color: var(--ink); }

    @media (max-width: 480px) {
      header, footer { padding-left: 20px; padding-right: 20px; }
      .card { padding: 34px 24px 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="https://www.strnetwork.cc" aria-label="STR Network 薩泰爾娛樂">STR NETWORK</a>
  </header>

  <main>
    <section class="card" aria-labelledby="title">
      <div class="tag">404 · SHOP CLOSED</div>
      <h1 id="title">這個頁面已不存在</h1>
      <p class="lead">薩泰爾線上周邊商店暫時休息中。你使用的可能是先前商品頁面的舊連結。</p>
      <div class="actions">
        <a class="btn primary" href="/">回到商店首頁</a>
        <a class="btn ghost" href="https://www.youtube.com/@STRNetworkasia">前往 YouTube 頻道看影片</a>
      </div>
    </section>
  </main>

  <footer>
    <span>© 薩泰爾娛樂股份有限公司</span>
    <span>
      <a href="https://www.strnetwork.cc">官方網站</a>　
      <a href="https://www.instagram.com/str_network/">Instagram</a>　
      <a href="https://www.facebook.com/strnetworkasia/">Facebook</a>
    </span>
  </footer>
</body>
</html>
