<style>
  :root{
    --bg:#000;
    --ink:#fff;
    --mute:#9a9a9a;
    --line:#2a2a2a;
    --yellow:#F5D000;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  header{
    padding:28px 32px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .brand{display:inline-block;line-height:0}
  .brand img{height:26px;width:auto;display:block}
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
  }
  .card{
    width:100%;
    max-width:560px;
    border:2px solid var(--ink);
    padding:44px 40px 40px;
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1px solid var(--line);
    pointer-events:none;
  }
  .tag{
    display:inline-block;
    background:var(--yellow);
    color:#000;
    font-weight:900;
    font-size:13px;
    padding:4px 10px;
    margin-bottom:22px;
  }
  h1{
    font-size:clamp(30px,6vw,44px);
    font-weight:900;
    line-height:1.2;
    letter-spacing:-.01em;
    margin-bottom:34px;
  }
  p.lead{
    color:var(--mute);
    font-size:16px;
    line-height:1.8;
    margin-bottom:34px;
    max-width:36ch;
  }
  .actions{display:flex;flex-direction:column;gap:12px}
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    height:56px;
    font-size:17px;
    font-weight:700;
    text-decoration:none;
    border:2px solid var(--ink);
    cursor:pointer;
    font-family:inherit;
    transition:background .15s,color .15s;
  }
  .btn.primary{background:var(--ink);color:#000}
  .btn.primary:hover{background:var(--yellow);border-color:var(--yellow)}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{background:#111}
  .btn:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
  .btn svg{width:22px;height:22px;flex:none}
  footer{
    padding:20px 32px;
    border-top:1px solid var(--line);
    color:var(--mute);
    font-size:12px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  footer a{color:var(--mute);text-decoration:none}
  footer a:hover{color:var(--ink)}
  @media (max-width:480px){
    header,footer{padding-left:20px;padding-right:20px}
    .card{padding:34px 24px 28px}
  }
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
